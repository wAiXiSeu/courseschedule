# nginx-mcp.conf — 课程表 MCP（Streamable HTTP）反向代理片段
#
# 用法：粘贴进已有的 https server { ... } 块（建议复用 plan.waixi.wang 的 443 站点）。
# 替换：__MCP_PORT__ → 后端端口（默认 8787，与 .env 的 MCP_HTTP_PORT 一致）。
# 重载：sudo nginx -t && sudo nginx -s reload
#
# 要点：
# - 必须 HTTPS：Authorization: Bearer 走明文头，不能走 http。
# - Authorization 头 nginx 默认透传，无需额外配置。
# - 后端返回 JSON（stateless，无 SSE），无需 proxy_buffering off。
# - 客户端可能对 /mcp 发 GET 探测 SSE，后端回 405，属正常，无需处理。

location = /mcp {
    proxy_pass http://127.0.0.1:__MCP_PORT__/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 可选：免鉴权健康检查（后端只返回 ok，不含任何敏感信息）
location = /mcp-health {
    proxy_pass http://127.0.0.1:__MCP_PORT__/health;
    access_log off;
}